
name: Test microOS SSHFS Storage

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install SSHFS
        run: |
          sudo apt-get update
          sudo apt-get install -y sshfs
          echo "=== Resources ==="
          nproc
          free -h
          df -h /

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MICROOS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MICROOS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/microos_key
          chmod 600 ~/.ssh/microos_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH connection
        env:
          WSL_IP: ${{ secrets.MICROOS_WSL_IP }}
        run: |
          ssh -i ~/.ssh/microos_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            microos-ci@"$WSL_IP" \
            "cat /home/microos-ci/test-files/hello.txt"

      - name: Mount Acer storage
        env:
          WSL_IP: ${{ secrets.MICROOS_WSL_IP }}
        run: |
          mkdir -p ~/microos-remote

          sshfs \
            microos-ci@"$WSL_IP":/home/microos-ci/test-files \
            ~/microos-remote \
            -o IdentityFile="$HOME/.ssh/microos_key" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ro \
            -o reconnect \
            -o ServerAliveInterval=15

          echo "=== Mounted storage ==="
          mountpoint ~/microos-remote
          ls -lah ~/microos-remote
          cat ~/microos-remote/hello.txt

      - name: Benchmark small file operations
        run: |
          python3 - <<'PY'
          import os
          import time

          path = os.path.expanduser("~/microos-remote")

          start = time.perf_counter()
          for i in range(100):
              os.stat(os.path.join(path, "hello.txt"))
          elapsed = time.perf_counter() - start

          print(f"100 file metadata operations: {elapsed:.3f} seconds")
          print(f"Average: {elapsed * 10:.2f} ms per operation")

          start = time.perf_counter()
          for i in range(100):
              with open(os.path.join(path, "hello.txt"), "rb") as f:
                  f.read()
          elapsed = time.perf_counter() - start

          print(f"100 small file reads: {elapsed:.3f} seconds")
          PY

      - name: Unmount remote storage
        if: always()
        run: |
          if mountpoint -q ~/microos-remote; then
            fusermount3 -u ~/microos-remote || \
              sudo umount ~/microos-remote
          fi
